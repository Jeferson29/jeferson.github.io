<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F3FF" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Fundo escuro com borda neon -->
  <rect width="90" height="90" x="5" y="5" rx="20" fill="#001A1D" stroke="#00F3FF" stroke-width="4" filter="url(#neon)"/>
  
  <!-- Símbolo </> -->
  <text x="50" y="52" font-family="monospace" font-size="38" font-weight="bold" fill="#00F3FF" text-anchor="middle" filter="url(#neon)">&lt;/&gt;</text>
  
  <!-- Texto DEV -->
  <text x="50" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DEV</text>
</svg>
